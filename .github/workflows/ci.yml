name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: cargo check
        run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: cargo clippy
        run: >
          cargo clippy --all-targets -- -D warnings -W clippy::pedantic
          -A clippy::missing_errors_doc -A clippy::missing_panics_doc
          -A clippy::module_name_repetitions -A clippy::must_use_candidate
          -A clippy::doc_markdown -A clippy::cast_precision_loss
          -A clippy::cast_possible_truncation -A clippy::cast_sign_loss
          -A clippy::cast_possible_wrap

  no-blanket-allows:
    name: No blanket allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no blanket allows
        run: |
          ! grep -rn '#!\[allow' src/ crates/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: cargo test
        run: cargo test --all-targets --no-fail-fast

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
